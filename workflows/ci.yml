name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd backend
        pytest || true
    
    - name: Check API health
      run: |
        cd backend
        python -c "from app.main import app; from fastapi.testclient import TestClient; client = TestClient(app); assert client.get('/health').status_code == 200"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Build
      run: |
        cd frontend
        npm run build
    
    - name: Check build output
      run: |
        cd frontend
        test -d dist && echo "Build successful" || exit 1

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check for secrets
      run: |
        if grep -r "password" backend/.env* frontend/.env* 2>/dev/null | grep -v "example" | grep -v ".example"; then
          echo "⚠️  Found potential secrets in .env files"
          exit 1
        fi
